<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380"><rect width="1100" height="380" rx="16" fill="#101820"/><g font-family="sans-serif"><text x="40" y="54" font-size="28" font-weight="bold" fill="#f1f5f9">A smaller, more focused coding workflow</text><text x="40" y="84" font-size="17" fill="#aabac8">Manual commands · local analysis · normal Claude permissions</text><rect x="40" y="122" width="240" height="166" rx="12" fill="#1d2b35" stroke="#456273"/><text x="56" y="155" font-size="14" fill="#8ce0b6">01 / USAGE</text><text x="56" y="196" font-size="19" font-weight="bold" fill="#eef4f8">Read local logs</text><text x="56" y="232" font-size="14" fill="#aabac8">Observed token counters</text><rect x="300" y="122" width="240" height="166" rx="12" fill="#1d2b35" stroke="#456273"/><text x="316" y="155" font-size="14" fill="#8ce0b6">02 / CONTEXT</text><text x="316" y="196" font-size="19" font-weight="bold" fill="#eef4f8">Select relevant code</text><text x="316" y="232" font-size="14" fill="#aabac8">Review before sharing</text><rect x="560" y="122" width="240" height="166" rx="12" fill="#1d2b35" stroke="#456273"/><text x="576" y="155" font-size="14" fill="#8ce0b6">03 / CHECKPOINT</text><text x="576" y="196" font-size="19" font-weight="bold" fill="#eef4f8">Save progress</text><text x="576" y="232" font-size="14" fill="#aabac8">Git HEAD + status + note</text><rect x="820" y="122" width="240" height="166" rx="12" fill="#1d2b35" stroke="#456273"/><text x="836" y="155" font-size="14" fill="#8ce0b6">04 / RESUME</text><text x="836" y="196" font-size="19" font-weight="bold" fill="#eef4f8">Recover your note</text><text x="836" y="232" font-size="14" fill="#aabac8">No automatic file restore</text><text x="40" y="340" fill="#aabac8" font-size="16">No quota bypass. No automatic provider switching. No verified token-saving percentage.</text></g></svg>